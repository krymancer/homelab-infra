apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiometadata
  namespace: aiometadata
  labels:
    app: aiometadata
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiometadata
  template:
    metadata:
      labels:
        app: aiometadata
    spec:
      containers:
        - name: aiometadata
          image: ghcr.io/cedya77/aiometadata:latest
          env:
            - name: PORT
              value: "3232"
            - name: HOST_NAME
              value: "https://meta.homelab.krymancer.dev"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URI
              value: "sqlite://addon/data/db.sqlite"
            - name: REDIS_URL
              value: "redis://127.0.0.1:6379"
            - name: ENABLE_CACHE_WARMING
              value: "false"
            - name: CACHE_WARMUP_ON_STARTUP
              value: "false"
            - name: TMDB_POPULAR_WARMING_ENABLED
              value: "false"
            - name: MAL_WARMUP_ENABLED
              value: "false"
          ports:
            - containerPort: 3232
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/addon/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3232
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              memory: 160Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 1000m
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              memory: 24Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 250m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aiometadata-data
