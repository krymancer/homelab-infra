apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
        args:
        - worker
        envFrom:
        - configMapRef:
            name: authentik-config
        env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: trial-secrets
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: trial-secrets
              key: POSTGRES_PASSWORD
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: trial-secrets
              key: AUTHENTIK_BOOTSTRAP_PASSWORD_HASH
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: shm
          mountPath: /dev/shm
        startupProbe:
          exec: &id001
            command:
            - ak
            - healthcheck
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 30
        readinessProbe:
          exec: *id001
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
        livenessProbe:
          exec: *id001
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: authentik-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
