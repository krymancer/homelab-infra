apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume
  namespace: reactive-resume
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reactive-resume
  template:
    metadata:
      labels:
        app: reactive-resume
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reactive-resume
        image: ghcr.io/amruthpillai/reactive-resume:v5.3.0@sha256:c487ec5edcfe054bcb312fcd498f868e56f274756d0046b01c83f210855017ab
        ports:
        - containerPort: 3000
        env:
        - name: APP_URL
          value: https://resume.homelab.krymancer.dev
        - name: PORT
          value: '3000'
        - name: LOCAL_STORAGE_PATH
          value: /app/data
        - name: FLAG_DISABLE_SIGNUPS
          value: 'true'
        - name: FLAG_DISABLE_EMAIL_AUTH
          value: 'false'
        - name: FLAG_ALLOW_UNSAFE_AI_BASE_URL
          value: 'false'
        - name: FLAG_ALLOW_UNSAFE_OAUTH_REDIRECT_URI
          value: 'false'
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: trial-secrets
              key: AUTH_SECRET
        - name: ENCRYPTION_SECRET
          valueFrom:
            secretKeyRef:
              name: reactive-resume-ai-encryption
              key: ENCRYPTION_SECRET
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: trial-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /app/data
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: resume-data
