apiVersion: v1
kind: Namespace
metadata:
  name: cliproxyapi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-auth
  namespace: cliproxyapi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: cliproxyapi}
  template:
    metadata:
      labels: {app: cliproxyapi}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      # v7.3.7 does not embed management.html. It downloads Cli-Proxy-API-Management-Center
      # releases/latest into static/ next to the config file. That directory is the read-only
      # Secret mount, and releases since v1.25.0 call /v8/management, which this binary does
      # not serve. Seed the last /v0 panel (v1.24.2) before the process starts.
      initContainers:
      - name: management-panel
        image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
        command: [/bin/sh, -c]
        args:
        - |
          set -eu
          dest=/var/lib/cliproxy-management/management.html
          url=https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/download/v1.24.2/management.html
          expected=51b24db8170a5414875602c2f4e35017185b1c1dd7e9a6b1c0de69905a81e997
          i=0
          while [ "$i" -lt 5 ]; do
            i=$((i + 1))
            if curl --fail --location --silent --show-error --retry 3 --output "$dest" "$url" \
              && echo "$expected  $dest" | sha256sum -c -; then
              exit 0
            fi
            echo "management panel download failed (attempt $i)" >&2
            rm -f "$dest"
            sleep 5
          done
          exit 1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
        - {name: management-static, mountPath: /var/lib/cliproxy-management}
        - {name: tmp, mountPath: /tmp}
      containers:
      - name: api
        image: eceasy/cli-proxy-api:v7.3.7@sha256:4ce7b1b52f8d7e176c2047870a1f312ceb44a7e1b7aa7367dc80d6ffc9671fe7
        command: [/bin/sh, -c]
        args: ['umask 077; exec /CLIProxyAPI/CLIProxyAPI -config /config/config.yaml']
        env:
        - {name: TZ, value: UTC}
        - {name: GOMEMLIMIT, value: 384MiB}
        # Read-only mount. The process serves this file and cannot replace it with a newer panel.
        - {name: MANAGEMENT_STATIC_PATH, value: /var/lib/cliproxy-management}
        ports:
        - {name: http, containerPort: 8317}
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: http}
          initialDelaySeconds: 20
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: '1', memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: auth, mountPath: /auth}
        - {name: tmp, mountPath: /tmp}
        - {name: management-static, mountPath: /var/lib/cliproxy-management, readOnly: true}
      volumes:
      - name: config
        secret: {secretName: cliproxyapi-config, defaultMode: 384}
      - name: auth
        persistentVolumeClaim: {claimName: codex-auth}
      - name: tmp
        emptyDir: {sizeLimit: 32Mi}
      - name: management-static
        emptyDir: {sizeLimit: 8Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  selector: {app: cliproxyapi}
  ports:
  - {name: http, port: 80, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: cliproxyapi
spec:
  ipAllowList:
    sourceRange: [192.168.0.0/24, 100.64.0.0/10, 10.42.0.0/24]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: concurrency
  namespace: cliproxyapi
spec:
  inFlightReq:
    amount: 4
    sourceCriterion: {requestHost: true}
---
# /v1 keeps the in-flight limit. Management traffic is a separate router so the
# panel's parallel /v0/management calls are not capped at 4, and so this router
# is not widened to "/" (that would also publish /v1beta and the OAuth callbacks).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: cliproxyapi-lan-only@kubernetescrd,cliproxyapi-concurrency@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [llm.homelab.krymancer.dev]
    secretName: homelab-wildcard-tls
  rules:
  - host: llm.homelab.krymancer.dev
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: cliproxyapi
            port: {number: 80}
---
# Same LAN allow-list as /v1. Not published on the Cloudflare Tunnel.
# /management.html is one inlined file. The panel then calls /v0/management.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxyapi-management
  namespace: cliproxyapi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: cliproxyapi-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [llm.homelab.krymancer.dev]
    secretName: homelab-wildcard-tls
  rules:
  - host: llm.homelab.krymancer.dev
    http:
      paths:
      - path: /management.html
        pathType: Exact
        backend:
          service:
            name: cliproxyapi
            port: {number: 80}
      - path: /v0/management
        pathType: Prefix
        backend:
          service:
            name: cliproxyapi
            port: {number: 80}
