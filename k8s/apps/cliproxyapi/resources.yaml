apiVersion: v1
kind: Namespace
metadata:
  name: cliproxyapi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-auth
  namespace: cliproxyapi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: cliproxyapi}
  template:
    metadata:
      labels: {app: cliproxyapi}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: api
        image: eceasy/cli-proxy-api:v7.3.7@sha256:4ce7b1b52f8d7e176c2047870a1f312ceb44a7e1b7aa7367dc80d6ffc9671fe7
        command: [/bin/sh, -c]
        args: ['umask 077; exec /CLIProxyAPI/CLIProxyAPI -config /config/config.yaml']
        env:
        - {name: TZ, value: UTC}
        - {name: GOMEMLIMIT, value: 384MiB}
        ports:
        - {name: http, containerPort: 8317}
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: http}
          initialDelaySeconds: 20
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: '1', memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: auth, mountPath: /auth}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        secret: {secretName: cliproxyapi-config, defaultMode: 384}
      - name: auth
        persistentVolumeClaim: {claimName: codex-auth}
      - name: tmp
        emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  selector: {app: cliproxyapi}
  ports:
  - {name: http, port: 80, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: cliproxyapi
spec:
  ipAllowList:
    sourceRange: [192.168.0.0/24, 100.64.0.0/10, 10.42.0.0/24]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: concurrency
  namespace: cliproxyapi
spec:
  inFlightReq:
    amount: 4
    sourceCriterion: {requestHost: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: cliproxyapi-lan-only@kubernetescrd,cliproxyapi-concurrency@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [llm.homelab.krymancer.dev]
    secretName: homelab-wildcard-tls
  rules:
  - host: llm.homelab.krymancer.dev
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: cliproxyapi
            port: {number: 80}
