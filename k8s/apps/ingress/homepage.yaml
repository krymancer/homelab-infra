apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
spec:
  tls:
    - hosts:
        - home.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: home.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
