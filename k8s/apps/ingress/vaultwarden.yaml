apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  tls:
    - hosts:
        - vault.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: vault.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
