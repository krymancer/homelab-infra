apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  tls:
    - hosts:
        - uptime.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: uptime.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
