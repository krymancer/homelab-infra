apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: default-proxmox-skipverify@kubernetescrd
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: v1
kind: Endpoints
metadata:
  name: proxmox
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.0.10
    ports:
      - name: https
        port: 8006
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: proxmox-skipverify
  namespace: default
spec:
  insecureSkipVerify: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxmox
  namespace: default
spec:
  tls:
    - hosts:
        - pve.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: pve.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxmox
                port:
                  number: 8006
