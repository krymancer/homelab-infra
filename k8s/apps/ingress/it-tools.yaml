apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-tools
  namespace: it-tools
spec:
  tls:
    - hosts:
        - tools.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: tools.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-tools
                port:
                  number: 80
