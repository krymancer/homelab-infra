apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
spec:
  tls:
    - hosts:
        - prometheus.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: prometheus.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prom-kube-prometheus-prometheus
                port:
                  number: 9090
    - host: prometheus.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prom-kube-prometheus-prometheus
                port:
                  number: 9090
