# EXAMPLE ONLY — do not commit real values.
# Create the live Secret out-of-band (see README), then leave it unmanaged by Git:
#
#   kubectl -n actual create secret generic actual-auto-sync \
#     --from-literal=serverURL='http://actual.actual.svc.cluster.local:5006' \
#     --from-literal=sessionToken='<token from Actual sessions table OR login>' \
#     --from-literal=budgetSyncId='<Sync ID from Actual Settings > Advanced>'
#
# Prefer password-based seriouslag/actual-auto-sync:26.9.0.3 once ACTUAL_SERVER_PASSWORD
# is stored in a proper secret manager; session tokens can be invalidated by re-login.
apiVersion: v1
kind: Secret
metadata:
  name: actual-auto-sync
  namespace: actual
type: Opaque
stringData:
  serverURL: http://actual.actual.svc.cluster.local:5006
  sessionToken: REPLACE_ME
  budgetSyncId: REPLACE_ME
