apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-info
  namespace: car-info
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: car-info-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - cars.homelab.krymancer.dev
    secretName: homelab-wildcard-tls
  rules:
  - host: cars.homelab.krymancer.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: car-info
            port:
              number: 80
