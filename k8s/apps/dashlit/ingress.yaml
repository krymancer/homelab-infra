# Defense in depth only: keep DNS private and do not publish a tunnel/port forward.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: dashlit
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
      - 100.64.0.0/10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashlit
  namespace: dashlit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: dashlit-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dashlit.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: dashlit.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashlit
                port:
                  name: http
