apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiostreams
  namespace: aiostreams
  labels:
    app: aiostreams
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiostreams
  template:
    metadata:
      labels:
        app: aiostreams
    spec:
      containers:
        - name: aiostreams
          image: ghcr.io/viren070/aiostreams:latest
          env:
            - name: BASE_URL
              value: "https://aio.homelab.krymancer.dev"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aiostreams-secrets
                  key: secret-key
            - name: AIOSTREAMS_AUTH
              valueFrom:
                secretKeyRef:
                  name: aiostreams-secrets
                  key: auth
            - name: AIOSTREAMS_AUTH_PERMISSIONS
              value: "junho=admin"
            # Force playback through the in-cluster MediaFlow proxy so debrid
            # link creation and playback share the homelab's public IP.
            - name: FORCE_PROXY_ENABLED
              value: "true"
            - name: FORCE_PROXY_ID
              value: "mediaflow"
            - name: FORCE_PROXY_URL
              value: "http://mediaflow-proxy.aiostreams.svc.cluster.local:8888"
            - name: FORCE_PROXY_PUBLIC_URL
              value: "https://flow.homelab.krymancer.dev"
            - name: FORCE_PROXY_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: aiostreams-secrets
                  key: mediaflow-password
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aiostreams-data
