apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  namespace: termix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: termix
  template:
    metadata:
      labels:
        app: termix
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        # Namespaced safe sysctl: bind loopback DNS as UID 1000, without capabilities.
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: '0'
      containers:
      - name: http
        image: ghcr.io/lukegus/termix:release-2.7.1@sha256:931e4ce466f4d29b157eb8d6dcd4d36ee5114495c6edddbb19d4e360e2a60f8d
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        env:
        - name: PORT
          value: '8080'
        - name: DATA_DIR
          value: /app/data
        - name: NODE_ENV
          value: production
        - name: ENABLE_GUACAMOLE
          value: 'true'
        - name: GUACD_HOST
          value: 127.0.0.1
        - name: GUACD_PORT
          value: '4822'
        - name: ENABLE_TELEMETRY
          value: 'false'
        - name: ENABLE_SSL
          value: 'false'
        - name: TRUSTED_PROXY_AUTH_ENABLED
          value: 'false'
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: termix-crypto
              key: JWT_SECRET
        - name: DATABASE_KEY
          valueFrom:
            secretKeyRef:
              name: termix-crypto
              key: DATABASE_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: termix-crypto
              key: ENCRYPTION_KEY
        - name: INTERNAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: termix-crypto
              key: INTERNAL_AUTH_TOKEN
        volumeMounts:
        - name: data
          mountPath: /app/data
        # Termix http and guacd use the loopback resolver for tailnet hostnames.
        # Tailscale sidecars retain ClusterFirst DNS so enrollment/control-plane
        # lookup cannot recurse into itself.
        - name: tailscale-dns
          mountPath: /etc/resolv.conf
          subPath: resolv.conf
          readOnly: true
      - name: guacd
        # Official image USER guacd is UID/GID 1000; no extra capabilities.
        image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
        imagePullPolicy: IfNotPresent
        # Override the image entrypoint bind of 0.0.0.0; loopback-only, no Service.
        command: [/opt/guacamole/sbin/guacd]
        args:
        - -f
        - -b
        - 127.0.0.1
        - -L
        - info
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          exec:
            command: [nc, -z, 127.0.0.1, '4822']
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: [nc, -z, 127.0.0.1, '4822']
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: tailscale-dns
          mountPath: /etc/resolv.conf
          subPath: resolv.conf
          readOnly: true
      - name: tailscale
        image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
        imagePullPolicy: IfNotPresent
        command: [tailscaled]
        args:
        - --tun=userspace-networking
        - --state=/var/lib/tailscale/state/tailscaled.state
        - --statedir=/var/lib/tailscale/state
        - --socket=/var/run/tailscale/tailscaled.sock
        - --socks5-server=127.0.0.1:1080
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 300m
            memory: 192Mi
        readinessProbe:
          exec:
            command: [tailscale, --socket=/var/run/tailscale/tailscaled.sock, ip, '-4']
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: tailscale-socket
          mountPath: /var/run/tailscale
      - name: tailscale-dns
        # Reuse the existing pinned image's Node runtime; no package installs.
        image: ghcr.io/lukegus/termix:release-2.7.1@sha256:931e4ce466f4d29b157eb8d6dcd4d36ee5114495c6edddbb19d4e360e2a60f8d
        imagePullPolicy: IfNotPresent
        command: [/usr/local/bin/node, /config/dns-forwarder.cjs]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/node
            - -e
            - "const s=require('net').connect(53,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: tailscale-dns
          mountPath: /config
          readOnly: true
        # LocalAPI is privileged to this identity; only this helper receives it.
        # No machine-state PVC or LocalAPI socket is mounted into http or guacd.
        - name: tailscale-socket
          mountPath: /var/run/tailscale
          readOnly: true
      volumes:
      - name: tailscale-socket
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: termix-data
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: termix-tailscale-state
      - name: tailscale-dns
        configMap:
          name: termix-tailscale-dns
