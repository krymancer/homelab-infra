apiVersion: v1
kind: ConfigMap
metadata:
  name: termix-tailscale-dns
  namespace: termix
data:
  resolv.conf: 'nameserver 127.0.0.1

    search tailcd7688.ts.net termix.svc.cluster.local svc.cluster.local cluster.local

    options ndots:1 timeout:5 attempts:2

    '
  dns-forwarder.cjs: "'use strict';\n// Pod-local split DNS: Tailscale LocalAPI for\
    \ MagicDNS, Cluster DNS otherwise.\nconst http = require('node:http');\nconst\
    \ net = require('node:net');\nconst dgram = require('node:dgram');\nconst fs =\
    \ require('node:fs');\nconst ZONE = 'tailcd7688.ts.net';\nconst clusterDNS = ()\
    \ => fs.readFileSync('/etc/resolv.conf', 'utf8').match(/^nameserver\\s+(\\S+)/m)[1];\n\
    \nfunction questionName(packet) {\n  if (packet.length < 17 || packet.readUInt16BE(4)\
    \ !== 1 || (packet[2] & 0x80)) throw Error('invalid query');\n  const labels =\
    \ [];\n  let i = 12;\n  while (packet[i]) {\n    const n = packet[i++];\n    if\
    \ (n > 63 || i + n >= packet.length) throw Error('invalid name');\n    labels.push(packet.subarray(i,\
    \ i + n).toString('ascii').toLowerCase());\n    i += n;\n  }\n  if (i + 5 > packet.length)\
    \ throw Error('missing question');\n  return labels.join('.');\n}\nfunction failure(packet)\
    \ {\n  const reply = Buffer.from(packet);\n  if (reply.length >= 12) {\n    reply[2]\
    \ = (reply[2] & 1) | 0x80;\n    reply[3] = 0x82; // recursion available, SERVFAIL\
    \ (never leak tailnet queries).\n    reply.fill(0, 6, 12);\n  }\n  return reply;\n\
    }\nfunction frame(packet) {\n  const size = Buffer.alloc(2);\n  size.writeUInt16BE(packet.length);\n\
    \  return Buffer.concat([size, packet]);\n}\nfunction exchange(packet, options\
    \ = {}) {\n  const name = questionName(packet);\n  const tailnet = name === ZONE\
    \ || name.endsWith('.' + ZONE);\n  if (tailnet) {\n    let end = 12;\n    while\
    \ (packet[end]) end += packet[end] + 1;\n    const types = {1:'A', 2:'NS', 5:'CNAME',\
    \ 6:'SOA', 12:'PTR', 13:'HINFO', 15:'MX', 16:'TXT', 28:'AAAA', 33:'SRV', 255:'ALL'};\n\
    \    const type = types[packet.readUInt16BE(end + 1)];\n    if (!type || packet.readUInt16BE(end\
    \ + 3) !== 1) return Promise.reject(Error('unsupported DNS question'));\n    return\
    \ new Promise((resolve, reject) => {\n      const request = http.get({\n     \
    \   socketPath: options.socketPath || '/var/run/tailscale/tailscaled.sock',\n\
    \        host: 'local-tailscaled.sock',\n        path: '/localapi/v0/dns-query?'\
    \ + new URLSearchParams({name: name + '.', type}),\n      }, response => {\n \
    \       let body = '';\n        response.on('data', data => { body += data; if\
    \ (body.length > 200000) request.destroy(Error('oversized DNS response')); });\n\
    \        response.on('error', reject);\n        response.on('end', () => {\n \
    \         try {\n            if (response.statusCode !== 200) throw Error('Tailscale\
    \ DNS unavailable');\n            const bytes = Buffer.from(JSON.parse(body).Bytes,\
    \ 'base64');\n            if (bytes.length < 12) throw Error('invalid DNS response');\n\
    \            packet.copy(bytes, 0, 0, 2); // LocalAPI generates its own transaction\
    \ ID.\n            resolve(bytes);\n          } catch (error) { reject(error);\
    \ }\n        });\n      });\n      const timer = setTimeout(() => request.destroy(Error('DNS\
    \ upstream timeout')), 4000);\n      request.on('close', () => clearTimeout(timer));\n\
    \      request.on('error', reject);\n    });\n  }\n  return new Promise((resolve,\
    \ reject) => {\n    const socket = net.createConnection({host: options.clusterHost\
    \ || clusterDNS(), port: options.clusterPort || 53});\n    let buffer = Buffer.alloc(0),\
    \ done = false;\n    const finish = (error, response) => {\n      if (done) return;\n\
    \      done = true;\n      clearTimeout(timer);\n      socket.destroy();\n   \
    \   error ? reject(error) : resolve(response);\n    };\n    const timer = setTimeout(()\
    \ => finish(Error('DNS upstream timeout')), 4000);\n    socket.on('error', error\
    \ => finish(error));\n    socket.on('end', () => finish(Error('DNS upstream EOF')));\n\
    \    socket.on('connect', () => socket.write(frame(packet)));\n    socket.on('data',\
    \ chunk => {\n      buffer = Buffer.concat([buffer, chunk]);\n      if (buffer.length\
    \ >= 2) {\n        const size = buffer.readUInt16BE(0);\n        if (size < 12)\
    \ return finish(Error('invalid DNS response'));\n        if (buffer.length >=\
    \ size + 2) {\n          const response = buffer.subarray(2, size + 2);\n    \
    \      if (!response.subarray(0, 2).equals(packet.subarray(0, 2))) return finish(Error('DNS\
    \ transaction mismatch'));\n          finish(null, response);\n        }\n   \
    \   }\n    });\n  });\n}\nfunction start(port = 53, options = {}) {\n  let active\
    \ = 0;\n  async function answer(packet) {\n    if (active >= 128) return failure(packet);\n\
    \    active++;\n    try { return await exchange(packet, options); }\n    catch\
    \ { return failure(packet); }\n    finally { active--; }\n  }\n  const udp = dgram.createSocket('udp4');\n\
    \  udp.on('message', async (packet, peer) => {\n    if (packet.length < 12) return;\n\
    \    const response = await answer(packet);\n    udp.send(response, peer.port,\
    \ peer.address, () => {});\n  });\n  const tcp = net.createServer(socket => {\n\
    \    socket.setTimeout(10000, () => socket.destroy());\n    socket.on('error',\
    \ () => {});\n    let pending = Buffer.alloc(0), chain = Promise.resolve();\n\
    \    socket.on('data', data => {\n      pending = Buffer.concat([pending, data]);\n\
    \      if (pending.length > 131072) return socket.destroy();\n      while (pending.length\
    \ >= 2 && pending.length >= pending.readUInt16BE(0) + 2) {\n        const size\
    \ = pending.readUInt16BE(0);\n        const packet = Buffer.from(pending.subarray(2,\
    \ size + 2));\n        pending = pending.subarray(size + 2);\n        if (size\
    \ < 12) return socket.destroy();\n        chain = chain.then(async () => {\n \
    \         const response = await answer(packet);\n          if (!socket.destroyed)\
    \ socket.write(frame(response));\n        });\n      }\n    });\n  });\n  tcp.maxConnections\
    \ = 128;\n  udp.bind(port, '127.0.0.1');\n  tcp.listen(port, '127.0.0.1');\n \
    \ return {udp, tcp};\n}\nif (require.main === module) start();\nmodule.exports\
    \ = {questionName, failure, frame, exchange, start};\n"
