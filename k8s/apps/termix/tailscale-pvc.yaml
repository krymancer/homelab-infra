apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: termix-tailscale-state
  namespace: termix
  annotations:
    # Identity state survives app rollback/removal; delete only deliberately.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
