apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: LEVEL
              value: "world"
            - name: TYPE
              value: "PAPER"
            - name: MEMORY
              value: "2G"
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: ONLINE_MODE
              value: "FALSE"
            - name: MOTD
              value: "A Minecraft Server"
            - name: HIDE_ONLINE_PLAYERS
              value: "true"
            - name: MODRINTH_PROJECTS
              value: "viaversion,viabackwards,essentialsx,chunky,skinsrestorer"
          ports:
            - containerPort: 25565
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 3Gi
              cpu: 3000m
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:0.17
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: playit-secret
                  key: secret-key
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 500m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
