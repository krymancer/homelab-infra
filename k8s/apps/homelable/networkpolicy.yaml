apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homelable-disable-outbound
  namespace: homelable
spec:
  podSelector:
    matchLabels:
      app: homelable
  policyTypes:
  - Egress
  # Everything except the existing HTTPS ingress remains denied, including
  # DNS, direct LAN access, Internet callbacks, and arbitrary network scans.
  # NetworkPolicy is L3/L4: it cannot restrict HTTPS Host/path at this ingress.
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system
    ports:
    - protocol: TCP
      port: 8443
