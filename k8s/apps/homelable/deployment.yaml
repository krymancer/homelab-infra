apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable
  namespace: homelable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelable
  template:
    metadata:
      labels:
        app: homelable
    spec:
      automountServiceAccountToken: false
      # Pin only this TLS name to the existing ingress Service; no external DNS
      # or LAN-wide egress is needed. Update if the Service is recreated.
      hostAliases:
      - ip: 10.43.213.255
        hostnames:
        - pve.homelab.krymancer.dev
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/pouzor/homelable-backend:3.6.0@sha256:1e501424e8c53989fcea1dc9311d46614ae159b2bfee4608a5c0cd5baee3e9dc
        imagePullPolicy: IfNotPresent
        securityContext: &id001
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: backend
          containerPort: 8000
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        env:
        - name: AUTH_MODE
          value: local
        - name: SQLITE_PATH
          value: /app/data/homelab.db
        - name: CORS_ORIGINS
          value: '["https://homelable.homelab.krymancer.dev"]'
        - name: SCANNER_RANGES
          value: '[]'
        - name: SCANNER_HTTP_RANGES
          value: '[]'
        - name: SCANNER_HTTP_PROBE_ENABLED
          value: 'false'
        - name: SERVICE_CHECK_ENABLED
          value: 'false'
        - name: MCP_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: homelable-mcp
              key: MCP_SERVICE_KEY
        - name: DOCS_VIEW_KEY
          value: ''
        - name: UNIFI_SYNC_ENABLED
          value: 'false'
        - name: LIVEVIEW_KEY
          value: ''
        - name: HOMEPAGE_API_KEY
          value: ''
        - name: PROXMOX_HOST
          value: pve.homelab.krymancer.dev
        - name: PROXMOX_PORT
          value: '443'
        - name: PROXMOX_VERIFY_TLS
          value: 'true'
        - name: PROXMOX_TOKEN_ID
          valueFrom:
            secretKeyRef:
              name: homelable-proxmox
              key: PROXMOX_TOKEN_ID
        - name: PROXMOX_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: homelable-proxmox
              key: PROXMOX_TOKEN_SECRET
        - name: PROXMOX_SYNC_ENABLED
          value: 'false'
        - name: ZIGBEE_SYNC_ENABLED
          value: 'false'
        - name: ZWAVE_SYNC_ENABLED
          value: 'false'
        - name: AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: homelable-auth
              key: AUTH_USERNAME
        - name: AUTH_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: homelable-auth
              key: AUTH_PASSWORD_HASH
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: homelable-auth
              key: SECRET_KEY
        volumeMounts:
        - name: data
          mountPath: /app/data
      - name: mcp
        image: ghcr.io/pouzor/homelable-mcp:3.6.0@sha256:42838c0733b6443bcb6aaa3310f39daa8e700817ddb1f4466ff58d5cc0013c85
        imagePullPolicy: IfNotPresent
        securityContext: *id001
        ports:
        - name: mcp
          containerPort: 8001
        env:
        - name: BACKEND_URL
          value: http://127.0.0.1:8000
        - name: MCP_API_KEY
          valueFrom:
            secretKeyRef:
              name: homelable-mcp
              key: MCP_API_KEY
        - name: MCP_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: homelable-mcp
              key: MCP_SERVICE_KEY
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      - name: frontend
        image: ghcr.io/pouzor/homelable-frontend:3.6.0@sha256:5950f4905da2ea92b2a3870066399e718987a4a23d16c368935b9ddb7901635a
        imagePullPolicy: IfNotPresent
        securityContext: *id001
        ports:
        - name: frontend
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 500m
            memory: 64Mi
        startupProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        command:
        - nginx
        args:
        - -g
        - daemon off;
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homelable-data
      - name: nginx-config
        configMap:
          name: homelable-nginx
      - name: nginx-tmp
        emptyDir:
          sizeLimit: 32Mi
