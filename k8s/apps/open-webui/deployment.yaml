apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: open-webui
          # Standard image (no bundled Ollama, no CUDA). GPU stays on the
          # Proxmox CT. Upstream USER is 0; non-root is untested.
          image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ENV
              value: prod
            - name: PORT
              value: "8080"
            - name: TZ
              value: America/Sao_Paulo
            - name: USE_OLLAMA_DOCKER
              value: "false"
            - name: ENABLE_OLLAMA_API
              value: "true"
            # Native Ollama API. Do not set K8S_FLAG: that rewrites this URL
            # to ollama-service.open-webui.svc.cluster.local.
            - name: OLLAMA_BASE_URL
              value: http://ollama.open-webui.svc.cluster.local:11434
            - name: WEBUI_URL
              value: https://webui.homelab.krymancer.dev
            - name: WEBUI_AUTH
              value: "true"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_VERSION_UPDATE_CHECK
              value: "false"
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_SECRET_KEY
            - name: WEBUI_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_ADMIN_EMAIL
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 36
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
