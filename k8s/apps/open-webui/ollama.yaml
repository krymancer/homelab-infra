# Live Ollama on Proxmox alt, CT 231. Not a second in-cluster Ollama.
# GPU passthrough for that CT stays on the host; this repo only publishes it.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: open-webui
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: open-webui
subsets:
  - addresses:
      - ip: 192.168.0.23
    ports:
      - name: http
        port: 11434
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: open-webui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: open-webui-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ollama.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: ollama.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama
                port:
                  number: 11434
