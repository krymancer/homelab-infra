# Installed into /config/custom_components by the install-custom-components
# init container. Re-run only replaces hacs and bambu_lab when the pinned
# release is not already on the PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-custom-components
  namespace: home-assistant
data:
  install.py: |
    import hashlib
    import json
    import os
    import shutil
    import stat
    import time
    import urllib.request
    from pathlib import Path
    from zipfile import ZipFile

    CONFIG = Path(os.environ.get("HA_CONFIG", "/config"))
    COMPONENTS = CONFIG / "custom_components"
    PINS = CONFIG / ".custom-component-pins"

    # Latest stable GitHub releases. HACS 2.0.5 is still the newest
    # non-prerelease tag. ha-bambulab v2.2.26 is the newest stable tag.
    RELEASES = (
        {
            "domain": "hacs",
            "version": "2.0.5",
            "url": "https://github.com/hacs/integration/releases/download/2.0.5/hacs.zip",
            "sha256": "97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413",
        },
        {
            "domain": "bambu_lab",
            "version": "2.2.26",
            "url": "https://github.com/greghesp/ha-bambulab/releases/download/v2.2.26/bambu_lab.zip",
            "sha256": "fc72606c55f76e5d0401b98723fe67a637faf01cdc16494572bcc228ca83cdcd",
        },
    )


    def log(message):
        print(message, flush=True)


    def manifest_version(domain):
        path = COMPONENTS / domain / "manifest.json"
        if not path.is_file():
            return None
        try:
            return json.loads(path.read_text()).get("version")
        except json.JSONDecodeError:
            return None


    def installed(domain, version):
        pin = PINS / domain
        return pin.is_file() and pin.read_text().strip() == version and manifest_version(domain) == version


    def download(url):
        request = urllib.request.Request(url, headers={"User-Agent": "home-assistant-init"})
        last_error = None
        for attempt in range(1, 6):
            try:
                with urllib.request.urlopen(request, timeout=120) as response:
                    return response.read()
            except Exception as err:
                last_error = err
                log(f"download failed ({attempt}/5): {err}")
                time.sleep(5)
        raise SystemExit(f"download failed: {last_error}")


    def safe_extract(blob, dest):
        dest.mkdir(parents=True, exist_ok=True)
        with ZipFile(blob) as archive:
            for info in archive.infolist():
                name = info.filename
                parts = Path(name).parts
                mode = info.external_attr >> 16
                if name.startswith("/") or ".." in parts or stat.S_ISLNK(mode):
                    raise SystemExit(f"refusing unsafe zip entry: {name}")
            archive.extractall(dest)
        if not (dest / "manifest.json").is_file():
            raise SystemExit("zip has no manifest.json at the top level")


    def install(spec):
        domain = spec["domain"]
        version = spec["version"]
        if installed(domain, version):
            log(f"{domain} {version} already installed")
            return
        log(f"installing {domain} {version}")
        blob_path = PINS / f".{domain}.zip"
        PINS.mkdir(parents=True, exist_ok=True)
        data = download(spec["url"])
        digest = hashlib.sha256(data).hexdigest()
        if digest != spec["sha256"]:
            raise SystemExit(f"{domain} sha256 mismatch: {digest}")
        blob_path.write_bytes(data)
        stage = PINS / f".stage-{domain}"
        if stage.exists():
            shutil.rmtree(stage)
        safe_extract(blob_path, stage)
        found = manifest_version_in(stage)
        if found != version:
            shutil.rmtree(stage)
            raise SystemExit(f"{domain} manifest version {found!r} != {version}")
        target = COMPONENTS / domain
        COMPONENTS.mkdir(parents=True, exist_ok=True)
        if target.exists():
            shutil.rmtree(target)
        shutil.move(str(stage), str(target))
        (PINS / domain).write_text(version + "\n")
        blob_path.unlink(missing_ok=True)
        log(f"installed {domain} {version}")


    def manifest_version_in(directory):
        try:
            return json.loads((directory / "manifest.json").read_text()).get("version")
        except json.JSONDecodeError:
            return None


    def main():
        COMPONENTS.mkdir(parents=True, exist_ok=True)
        PINS.mkdir(parents=True, exist_ok=True)
        for spec in RELEASES:
            install(spec)


    if __name__ == "__main__":
        main()
