apiVersion: apps/v1
kind: Deployment
metadata:
  name: hledger
  namespace: hledger
  labels:
    app: hledger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hledger
  template:
    metadata:
      labels:
        app: hledger
    spec:
      # Image USER is hledger. NAS files are nas/root; run as root so
      # HLEDGER_ALLOW=add can append on the RW NFS mount. Do not set
      # fsGroup — that would chown the shared finance tree.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: hledger-web
          image: dastapov/hledger:1.52.3
          env:
            - name: HLEDGER_HOST
              value: "0.0.0.0"
            - name: HLEDGER_PORT
              value: "5000"
            - name: HLEDGER_BASE_URL
              value: "https://hledger.homelab.krymancer.dev"
            - name: HLEDGER_JOURNAL_FILE
              value: "/data/hledger.journal"
            # view | add | edit — hledger-web has no password; add is the stock default.
            - name: HLEDGER_ALLOW
              value: "add"
          ports:
            - containerPort: 5000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 256Mi
              cpu: 250m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hledger-finance
