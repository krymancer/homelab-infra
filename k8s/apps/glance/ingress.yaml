# Defense in depth only: keep DNS private and do not publish a tunnel/port forward.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: glance
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
      - 100.64.0.0/10
      # Tailscale subnet-router SNAT uses its dynamic k3s pod address.
      - 10.42.0.0/24
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glance
  namespace: glance
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: glance-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - home.homelab.krymancer.dev
      secretName: homelab-wildcard-tls
  rules:
    - host: home.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glance
                port:
                  name: http
