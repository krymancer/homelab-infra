# Scrapes Proxmox VE API on https://192.168.0.11:8006 via /pve?target=...
# Credentials come from Secret `pve-exporter` (not in git). See README.md.
#
# Prometheus scrape of /pve is additionalScrapeConfigs in values.yaml
# (helm upgrade). This Service is only the exporter process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pve-exporter
  template:
    metadata:
      labels:
        app: pve-exporter
    spec:
      containers:
        - name: pve-exporter
          image: prompve/prometheus-pve-exporter:3.10.0
          env:
            - name: PVE_USER
              valueFrom:
                secretKeyRef:
                  name: pve-exporter
                  key: user
                  optional: true
            - name: PVE_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: pve-exporter
                  key: token_name
                  optional: true
            - name: PVE_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: pve-exporter
                  key: token_value
                  optional: true
            # alt uses the typical self-signed PVE certificate.
            - name: PVE_VERIFY_SSL
              value: "false"
          ports:
            - name: http
              containerPort: 9221
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  selector:
    app: pve-exporter
  ports:
    - name: http
      port: 9221
      targetPort: http
