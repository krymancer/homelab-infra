# Ookla CLI wrapper. Metric names match Internet Monitoring:
#   speedtest_download_bits_per_second
#   speedtest_upload_bits_per_second
#   speedtest_ping_latency_milliseconds
#   speedtest_jitter_latency_milliseconds
#
# SPEEDTEST_CACHE_FOR plus a 45m ServiceMonitor interval keep tests gentle.
# scrapeTimeout must exceed SPEEDTEST_TIMEOUT (90s).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-exporter
  namespace: monitoring
  labels:
    app: speedtest-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedtest-exporter
  template:
    metadata:
      labels:
        app: speedtest-exporter
    spec:
      containers:
        - name: speedtest-exporter
          image: ghcr.io/ishioni/speedtest-exporter:0.2.5
          env:
            - name: SPEEDTEST_PORT
              value: "9798"
            - name: SPEEDTEST_CACHE_FOR
              value: 45m
            - name: SPEEDTEST_TIMEOUT
              value: 90s
          ports:
            - name: http
              containerPort: 9798
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-exporter
  namespace: monitoring
  labels:
    app: speedtest-exporter
spec:
  selector:
    app: speedtest-exporter
  ports:
    - name: http
      port: 9798
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: speedtest-exporter
  namespace: monitoring
  labels:
    app: speedtest-exporter
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: speedtest-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 45m
      scrapeTimeout: 120s
