apiVersion: v1
kind: ConfigMap
metadata:
  name: alt-host-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab
data:
  alt-homelab-host.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Proxmox host alt (192.168.0.11): node_exporter on :9100, PVE API via pve-exporter, guests hermes (LXC 210) and k3s (VM 220). GPU panels are placeholders: the RTX 2060 is VFIO-bound.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "code": {
              "language": "markdown",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "The **RTX 2060 is VFIO-bound on alt** (`vfio-pci`, intended for passthrough). There are **no host nvidia-smi / DCGM / NVML metrics**. To graph GPU utilization, unbind the card on the host or run a GPU guest with a DCGM/nvml exporter. Do not expect `DCGM_FI_*` or `nvidia_smi_*` series while the device is assigned to VFIO.",
            "mode": "markdown"
          },
          "pluginVersion": "11.0.0",
          "title": "GPU (placeholder)",
          "type": "text"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Requires node_exporter on alt listening at 192.168.0.11:9100.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "spanNulls": true,
                "showPoints": "auto",
                "pointSize": 5,
                "fillOpacity": 10
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{job=\"node-exporter-alt\",mode=\"idle\"}[5m]))",
              "legendFormat": "busy",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "title": "CPU (alt host)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "spanNulls": true,
                "showPoints": "auto",
                "pointSize": 5,
                "fillOpacity": 10
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "1 - (node_memory_MemAvailable_bytes{job=\"node-exporter-alt\"} / node_memory_MemTotal_bytes{job=\"node-exporter-alt\"})",
              "legendFormat": "used",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "title": "Memory (alt host)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "spanNulls": true,
                "showPoints": "auto",
                "pointSize": 5,
                "fillOpacity": 10
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{job=\"node-exporter-alt\",fstype!~\"tmpfs|devtmpfs|overlay|squashfs|iso9660\"} / node_filesystem_size_bytes{job=\"node-exporter-alt\",fstype!~\"tmpfs|devtmpfs|overlay|squashfs|iso9660\"}",
              "legendFormat": "{{mountpoint}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "title": "Disk free (alt host)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "spanNulls": true,
                "showPoints": "auto",
                "pointSize": 5,
                "fillOpacity": 10
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{job=\"node-exporter-alt\",device=~\"vmbr.*|enp.*|eth.*|eno.*|wlp.*\"}[5m]) * 8",
              "legendFormat": "rx {{device}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{job=\"node-exporter-alt\",device=~\"vmbr.*|enp.*|eth.*|eno.*|wlp.*\"}[5m]) * 8",
              "legendFormat": "tx {{device}}",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "title": "Network (alt host)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Empty if the RAPL collector is unavailable (permissions, CPU, or node_exporter flags).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "spanNulls": true,
                "showPoints": "auto",
                "pointSize": 5,
                "fillOpacity": 10
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "rate(node_rapl_package_joules_total{job=\"node-exporter-alt\"}[5m])",
              "legendFormat": "{{instance}} {{zone}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "title": "RAPL package power",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "From prometheus-pve-exporter against https://192.168.0.11:8006. Needs Secret pve-exporter.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "spanNulls": true,
                "showPoints": "auto",
                "pointSize": 5,
                "fillOpacity": 10
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "pve_cpu_usage_ratio * on(id) group_left(name, type) pve_guest_info{name=~\"hermes|k3s\"}",
              "legendFormat": "{{name}} ({{type}})",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "title": "PVE guest CPU",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "spanNulls": true,
                "showPoints": "auto",
                "pointSize": 5,
                "fillOpacity": 10
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "(pve_memory_usage_bytes / pve_memory_size_bytes) * on(id) group_left(name, type) pve_guest_info{name=~\"hermes|k3s\"}",
              "legendFormat": "{{name}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "title": "PVE guest memory",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Join pve_up / CPU / memory / uptime onto pve_guest_info. Empty until pve-exporter credentials work.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "cpu"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "memory"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "uptime_seconds"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "id": 9,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "expr": "pve_up * on(id) group_left(name, type, node) pve_guest_info{name=~\"hermes|k3s\"}",
              "legendFormat": "up",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table",
              "instant": true
            },
            {
              "expr": "pve_cpu_usage_ratio * on(id) group_left(name) pve_guest_info{name=~\"hermes|k3s\"}",
              "legendFormat": "cpu",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table",
              "instant": true
            },
            {
              "expr": "(pve_memory_usage_bytes / clamp_min(pve_memory_size_bytes, 1)) * on(id) group_left(name) pve_guest_info{name=~\"hermes|k3s\"}",
              "legendFormat": "memory",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table",
              "instant": true
            },
            {
              "expr": "pve_uptime_seconds * on(id) group_left(name) pve_guest_info{name=~\"hermes|k3s\"}",
              "legendFormat": "uptime",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table",
              "instant": true
            }
          ],
          "title": "PVE guests (hermes, k3s)",
          "transformations": [
            {
              "id": "seriesToColumns",
              "options": {
                "byField": "id"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true
                },
                "renameByName": {
                  "Value #A": "up",
                  "Value #B": "cpu",
                  "Value #C": "memory",
                  "Value #D": "uptime_seconds"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "alt",
        "proxmox",
        "homelab"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Alt / Homelab Host",
      "uid": "alt-homelab-host",
      "version": 1,
      "weekStart": ""
    }
