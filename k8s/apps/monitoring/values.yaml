# kube-prometheus-stack values for the existing one-shot Helm release
# `kube-prom` (chart kube-prometheus-stack-83.4.2) in namespace `monitoring`.
#
# This file is NOT Argo-synced. Putting the Helm release under Argo would
# fight the live `kube-prom` install (release secret, PVC names, CR ownership).
# Exporters, Probe/ServiceMonitor CRs, and dashboards live in extras/ and are
# synced by Application `monitoring`.
#
# Probe / ServiceMonitor objects in extras/ are labeled `release: kube-prom`
# so the operator's default helm-value selectors pick them up without widening
# Prometheus to scrape the whole cluster.
#
# After changing this file (mixin prune, scrape jobs, NodePorts):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade kube-prom prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --version 83.4.2 \
#     -f k8s/apps/monitoring/values.yaml

grafana:
  adminPassword: admin
  # Quiet Grafana: drop kube-prometheus mixin dashboards (chart 83.x).
  defaultDashboardsEnabled: false
  # Direct ConfigMap mounts retain the three custom dashboards without watchers.
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/homelab/alt/alt-homelab-host.json
  # Static provisioning avoids two always-running Python watcher containers.
  sidecar:
    datasources:
      enabled: false
      uid: prometheus
    dashboards:
      enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://kube-prom-kube-prometheus-prometheus.monitoring.svc:9090
          isDefault: true
          editable: false
          jsonData:
            timeInterval: 60s
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: false
          updateIntervalSeconds: 60
          allowUiUpdates: false
          options:
            path: /var/lib/grafana/dashboards/homelab
  extraConfigmapMounts:
    - name: alt-dashboard
      configMap: alt-host-dashboard
      mountPath: /var/lib/grafana/dashboards/homelab/alt
      readOnly: true
    - name: internet-dashboard
      configMap: internet-monitoring-dashboard
      mountPath: /var/lib/grafana/dashboards/homelab/internet
      readOnly: true
    - name: k3s-dashboard
      configMap: k3s-cluster-dashboard
      mountPath: /var/lib/grafana/dashboards/homelab/k3s
      readOnly: true
  service:
    type: NodePort
    nodePort: 30900
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi

prometheus:
  service:
    type: NodePort
    nodePort: 30901
  prometheusSpec:
    # Homelab resolution: one minute is sufficient for dashboards and alerts.
    scrapeInterval: 60s
    evaluationInterval: 60s
    retention: 15d
    # A soft Go heap budget, not an OOM-inducing Kubernetes memory cap.
    additionalArgs:
      - name: no-auto-gomemlimit
    containers:
      - name: prometheus
        env:
          - name: GOMEMLIMIT
            value: 320MiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # Host node_exporter + pve-exporter /pve. Blackbox and speedtest are
    # Probe / ServiceMonitor CRs in extras/ (same release label).
    additionalScrapeConfigs:
      - job_name: node-exporter-alt
        scrape_interval: 60s
        static_configs:
          - targets:
              - 192.168.0.11:9100
            labels:
              instance: alt
              nodename: alt
              homelab_role: proxmox-host
      # Optional: Hermes LXC node_exporter (install later, then uncomment).
      # - job_name: node-exporter-hermes
      #   scrape_interval: 60s
      #   static_configs:
      #     - targets:
      #         - 192.168.0.22:9100
      #       labels:
      #         instance: hermes
      #         nodename: hermes
      #         homelab_role: lxc-guest
      - job_name: pve
        scrape_interval: 60s
        scrape_timeout: 20s
        metrics_path: /pve
        params:
          module:
            - default
          target:
            - 192.168.0.11
        static_configs:
          - targets:
              - pve-exporter.monitoring.svc:9221
            labels:
              instance: alt
              homelab_role: proxmox-api

# k3s exposes embedded control-plane metrics at both API and kubelet endpoints.
# Keep one copy under job=apiserver; preserve kubelet, cAdvisor and probe metrics.
kubelet:
  serviceMonitor:
    interval: 60s
    metricRelabelings:
      # Preserve the chart's default noisy storage histogram filter.
      - action: drop
        regex: '(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?'
        sourceLabels: [__name__, le]
      - action: drop
        regex: '(apiserver|etcd|scheduler|workqueue|kubeproxy)_.*'
        sourceLabels: [__name__]

# API-server latency distributions are not used by the homelab dashboards.
# Keep request/error counters and availability, but stop per-bucket ingestion.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: '.*_bucket'

defaultRules:
  rules:
    # These rules require the removed API-server latency buckets.
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    etcd: false

alertmanager:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: false
