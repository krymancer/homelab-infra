# PO token provider for cobalt. Without a po_token YouTube lets cobalt read
# video metadata but refuses the media streams for many videos, so the tunnel
# comes back empty ("file tunnel is empty").
# cobalt 11 calls POST <YOUTUBE_SESSION_SERVER>/get_pot and reads
# poToken + contentBinding, which is this provider's API (see deployment.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pot-provider
  namespace: cobalt
  labels:
    app: pot-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pot-provider
  template:
    metadata:
      labels:
        app: pot-provider
    spec:
      containers:
        - name: pot-provider
          image: brainicism/bgutil-ytdlp-pot-provider:latest
          ports:
            - containerPort: 4416
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: pot-provider
  namespace: cobalt
spec:
  type: ClusterIP
  selector:
    app: pot-provider
  ports:
    - name: http
      port: 4416
      targetPort: 4416
