# Generates YouTube po_token + visitor_data for cobalt. Without them YouTube
# lets cobalt read video metadata but refuses the media streams for many
# videos, so the tunnel comes back empty ("file tunnel is empty").
# cobalt reads it via YOUTUBE_SESSION_SERVER (see deployment.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-session-generator
  namespace: cobalt
  labels:
    app: yt-session-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yt-session-generator
  template:
    metadata:
      labels:
        app: yt-session-generator
    spec:
      containers:
        - name: yt-session-generator
          image: ghcr.io/imputnet/yt-session-generator:webserver
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            # Chromium needs more shared memory than the 64Mi default.
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
              cpu: "1"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: yt-session-generator
  namespace: cobalt
spec:
  type: ClusterIP
  selector:
    app: yt-session-generator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
