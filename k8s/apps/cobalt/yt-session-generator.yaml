# Generates YouTube po_token + visitor_data for cobalt. Without them YouTube
# lets cobalt read video metadata but refuses the media streams for many
# videos, so the tunnel comes back empty ("file tunnel is empty").
# cobalt reads it via YOUTUBE_SESSION_SERVER (see deployment.yaml).
#
# cobalt 11.x calls `POST /get_pot` with no body and reads
# poToken/contentBinding, which is the bgutil-ytdlp-pot-provider API.
# The old imputnet yt-session-generator only serves /token (404 here).
# Stay on bgutil 1.x: 2.x rejects requests without a JSON body, and
# cobalt sends none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-session-generator
  namespace: cobalt
  labels:
    app: yt-session-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yt-session-generator
  template:
    metadata:
      labels:
        app: yt-session-generator
    spec:
      containers:
        - name: yt-session-generator
          image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
          ports:
            - containerPort: 4416
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: yt-session-generator
  namespace: cobalt
spec:
  type: ClusterIP
  selector:
    app: yt-session-generator
  ports:
    # Keep 8080 so cobalt's YOUTUBE_SESSION_SERVER stays unchanged.
    - name: http
      port: 8080
      targetPort: 4416
