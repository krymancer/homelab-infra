apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cliproxyapi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krymancer/homelab-infra.git
    targetRevision: main
    path: k8s/apps/cliproxyapi
  destination:
    server: https://kubernetes.default.svc
    namespace: cliproxyapi
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
