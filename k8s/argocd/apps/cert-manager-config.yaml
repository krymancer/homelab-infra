apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krymancer/homelab-infra.git
    targetRevision: main
    path: k8s/apps/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: default
