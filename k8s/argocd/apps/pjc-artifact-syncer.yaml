apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pjc-artifact-syncer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LibraeOrg/pjc-artifact-syncer.git
    targetRevision: main
    path: k8s/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: pjc-artifact-syncer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
