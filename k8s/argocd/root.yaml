# Production app-of-apps (pve VM 200 / 192.168.0.20). Staging on alt uses a
# Terraform-applied Application (see k8s/argocd/staging-root.yaml) that excludes
# pihole.yaml so LoadBalancer 192.168.0.20 is not stolen by a parallel cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krymancer/homelab-infra.git
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
